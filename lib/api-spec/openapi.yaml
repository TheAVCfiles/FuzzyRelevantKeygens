        observed_volume: { type: number }
        coordinated_share: { type: number }
        authentic_concern: { type: string }
        commercial_exposure:
          type: array
          items: { type: string }
    PullRequest:
      type: object
      required: [id, opened_at, finding, moves, state, merged_move_id]
      properties:
        id: { type: string }
        opened_at: { type: string }
        finding: { $ref: "#/components/schemas/PullRequestFinding" }
        moves:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/PullRequestMove" }
        state: { type: string }
        merged_move_id: { type: ["string", "null"] }
    SignPullRequestInput:
      type: object
      required: [move_id]
      properties:
        move_id: { type: string }
    Evaluation:
      type: object
      required: [pass, rule_id, reason, receipt_entry]
      properties:
        pass: { type: boolean }
        rule_id: { type: string }
        reason: { type: string }
        receipt_entry: { type: string }
    PolicyClaim:
      type: object
      required: [text, source_class, source_ref, is_third_party, tags]
      properties:
        text: { type: string }
        source_class: { type: string }
        source_ref: { type: ["string", "null"] }
        is_third_party: { type: boolean }
        tags:
          type: array
          items: { type: string }
    PolicyEvaluationInput:
      type: object
      required: [action, target_platform, territory, claims]
      properties:
        action: { type: string }
        target_platform: { type: string }
        territory: { type: string }
        claims:
          type: array
          items: { $ref: "#/components/schemas/PolicyClaim" }
    AgentStage:
      type: object
      required: [id, role, status]
      properties:
        id: { type: string }
        role: { type: string }
        status: { type: string }
    AgentRunResult:
      type: object
      required: [mode, stages, message]
      properties:
        mode:
          type: string
          enum: [gemini, fixture_fallback]
        stages:
          type: array
          items: { $ref: "#/components/schemas/AgentStage" }
        message: { type: string }
    DropClaim:
      type: object
      required: [text, source_class, source_ref]
      properties:
        text: { type: string }
        source_class: { type: string }
        source_ref: { type: string }
    DropEdition:
      type: object
      required: [number, of]
      properties:
        number: { type: number }
        of: { type: number }
    DropSeal:
      type: object
      required: [issued_at, signed_by, scope_ref, signatures_simulated]
      properties:
        issued_at: { type: string }
        signed_by: { type: string }
        scope_ref: { type: string }
        signatures_simulated: { type: boolean }
    Drop:
      type: object
      required: [drop_id, call_id, title, edition, claims, hash, seal]
      properties:
        drop_id: { type: string }
        call_id: { type: string }
        title: { type: string }
        edition: { $ref: "#/components/schemas/DropEdition" }
        claims:
          type: array
          items: { $ref: "#/components/schemas/DropClaim" }
        hash: { type: string }
        seal: { $ref: "#/components/schemas/DropSeal" }
    SignResult:
      type: object
      required: [evaluation, drop]
      properties:
        evaluation: { $ref: "#/components/schemas/Evaluation" }
        drop: { $ref: "#/components/schemas/Drop" }
    DismissResult:
      type: object
      required: [dismissed, receipt_entry]
      properties:
        dismissed: { type: boolean }
        receipt_entry: { type: string }
    VerifyDropInput:
      type: object
      required: [lookup]
      properties:
        lookup: { type: string }
    VerifyResult:
      type: object
      required: [status, drop]
      properties:
        status:
          type: string
          enum: [SEALED, NOT_IN_REGISTRY]
        drop:
          oneOf:
            - $ref: "#/components/schemas/Drop"
            - type: "null"
    Receipt:
      type: object
      required: [ts, actor, action, call_id, result, rule_fired]
      properties:
        ts: { type: string }
        actor: { type: string }
        action: { type: string }
        call_id: { type: string }
        result: { type: string }
        rule_fired: { type: ["string", "null"] }

