openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: autography
    description: Synthetic Autography experience
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /show:
    get:
      operationId: getShow
      tags: [autography]
      summary: Get the current synthetic episode
      responses:
        "200":
          description: Show and episode context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Show"
  /flood:
    get:
      operationId: getFlood
      tags: [autography]
      summary: Get the Signal Room flood and clusters
      parameters:
        - name: source
          in: query
          required: false
          description: Use the approved live connector, or the synthetic fixture fallback.
          schema:
            type: string
            enum: [fixture, live]
      responses:
        "200":
          description: Signal events grouped into clusters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloodResponse"
  /flood/observations:
    post:
      operationId: ingestLiveObservations
      tags: [autography]
      summary: Ingest observations from the approved consented newsroom connector
      description: |
        Connector boundary for the policy-reviewed pilot source `consented-newsroom-v1`.
        The source must send its consent and policy review references. Identity fields are
        intentionally not accepted. Content is retained only for server-side grouping and
        is de-amplified in the Signal Room response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveObservationBatch"
      responses:
        "202":
          description: Observations accepted and normalized into the live room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveObservationReceipt"
        "400":
          description: The source envelope is invalid or not approved
  /podcast/sources:
    get:
      operationId: getPodcastRoom
      tags: [autography]
      summary: Get podcast intelligence sources and ranked concepts
      responses:
        "200":
          description: Podcast intelligence room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastRoom"
    post:
      operationId: addPodcastSource
      tags: [autography]
      summary: Add a consented public or manually supplied source URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPodcastSourceInput"
      responses:
        "200":
          description: Updated podcast intelligence room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastRoom"
  /podcast/search:
    post:
      operationId: searchPodcastContexts
      tags: [autography]
      summary: Search the curated entertainment context desk
      description: Returns ranked, source-backed context packages. It does not scrape, identify people, or create production artifacts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PodcastContextSearchInput"
      responses:
        "200":
          description: Ranked entertainment context packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastContextSearchResponse"
  /podcast/runs/{id}/attestation:
    post:
      operationId: attestPodcastCuttingRoom
      tags: [autography]
      summary: Add or decline a private cutting-room attestation for the active grounded run
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PodcastCuttingRoomAttestationInput"
      responses:
        "200":
          description: Private attestation receipt for the grounded run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastCuttingRoomAttestation"
  /podcast/live-snapshot:
    get:
      operationId: getPodcastLiveSnapshot
      tags: [autography]
      summary: Refresh the bounded podcast live-signal snapshot
      description: Returns only aggregate metadata from the approved consented newsroom source, with an explicit synthetic fallback when no live batch is available.
      responses:
        "200":
          description: Bounded live-signal snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastLiveSnapshot"
  /podcast/development:
    post:
      operationId: createPodcastDevelopment
      tags: [autography]
      summary: Create source-backed podcast format variants for human review
      description: Creates inspectable editorial hypotheses and never approves a brief, renders audio, imitates a real person, or publishes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PodcastDevelopmentInput"
      responses:
        "201":
          description: Draft development plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastDevelopmentPlan"
  /podcast/development/{id}/validation:
    post:
      operationId: recordPodcastDevelopmentValidation
      tags: [autography]
      summary: Record a human development-plan decision
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PodcastDevelopmentValidationInput"
      responses:
        "200":
          description: Reviewed development plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastDevelopmentPlan"
  /podcast/presets:
    post:
      operationId: createPodcastFilterPreset
      tags: [autography]
      summary: Save a reusable podcast comparison filter preset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PodcastFilterPresetInput"
      responses:
        "201":
          description: Saved comparison filter preset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastFilterPreset"
  /podcast/presets/{id}:
    patch:
      operationId: renamePodcastFilterPreset
      tags: [autography]
      summary: Rename a podcast comparison filter preset
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PodcastFilterPresetRenameInput"
      responses:
        "200":
          description: Renamed comparison filter preset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastFilterPreset"
    delete:
      operationId: deletePodcastFilterPreset
      tags: [autography]
      summary: Remove a podcast comparison filter preset
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Comparison filter preset removed
  /podcast/brief:
    post:
      operationId: generatePodcastBrief
      tags: [autography]
      summary: Generate a source-backed podcast brief for human review
      description: The generated brief is durably stored server-side so its provenance and review state survive an API restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePodcastBriefInput"
      responses:
        "200":
          description: Draft podcast brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastBrief"
  /podcast/brief/{id}/decision:
    post:
      operationId: decidePodcastBrief
      tags: [autography]
      summary: Approve or reject a podcast brief before rendering
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PodcastBriefDecisionInput"
      responses:
        "200":
          description: Updated podcast brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastBrief"
  /podcast/brief/{id}/script:
    post:
      operationId: createPodcastScript
      tags: [autography]
      summary: Open a script-only workspace from an approved brief
      description: The workspace and its provenance are durably stored server-side and remain gated by the persisted brief approval state.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Gated podcast script workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastScriptWorkspace"
        "409":
          description: Brief is not approved
    get:
      operationId: getPodcastScriptByBrief
      tags: [autography]
      summary: Retrieve a script workspace by its approved brief
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Previously created script workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastScriptWorkspace"
        "404":
          description: Script workspace not found
        "409":
          description: Brief is not approved
  /podcast/script/{id}:
    get:
      operationId: getPodcastScript
      tags: [autography]
      summary: Retrieve a script workspace by workspace ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Previously created script workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastScriptWorkspace"
        "404":
          description: Script workspace not found
        "409":
          description: Brief is not approved
  /podcast/script/{id}/decision:
    post:
      operationId: decidePodcastScript
      tags: [autography]
      summary: Approve or reject a podcast script before audio work
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PodcastScriptDecisionInput"
      responses:
        "200":
          description: Reviewed podcast script workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastScriptWorkspace"
  /podcast/script/{id}/release-kit:
    post:
      operationId: createPodcastReleaseKit
      tags: [autography]
      summary: Prepare a release kit from an approved podcast script
      description: Creates a staged editorial and promotion package. It never renders audio, exports, publishes, or bypasses final human approval.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Staged release kit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastReleaseKit"
        "409":
          description: Script is not approved
  /podcast/script/{id}/audio/decision:
    post:
      operationId: decidePodcastAudio
      tags: [autography]
      summary: Approve or reject audio generation for a staged release kit
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PodcastAudioDecisionInput"
      responses:
        "200":
          description: Updated script workspace and audio gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastScriptWorkspace"
        "409":
          description: Script or release kit is not ready for audio approval
  /podcast/script/{id}/audio:
    post:
      operationId: generatePodcastAudio
      tags: [autography]
      summary: Generate a short spoken clip from an audio-approved script
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Generated playable podcast clip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastAudioClip"
        "409":
          description: Audio generation has not been approved
    get:
      operationId: getPodcastAudio
      tags: [autography]
      summary: Retrieve generated clip metadata
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Generated playable podcast clip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastAudioClip"
        "404":
          description: Audio clip has not been generated
  /podcast/audio/{id}/stream:
    get:
      operationId: streamPodcastAudio
      tags: [autography]
      summary: Stream an approved generated podcast clip
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: WAV audio stream
          content:
            audio/wav:
              schema:
                type: string
                format: binary
  /podcast/reset:
    post:
      operationId: resetPodcastDemo
      tags: [autography]
      summary: Reset authenticated podcast demo state and return a pre-staged input
      responses:
        "200":
          description: Reset state and a pre-staged project input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastResetResponse"
  /podcast/cut-keys/{key}:
    get:
      operationId: getPodcastCutKey
      tags: [autography]
      summary: Get a public integrity manifest for an approved podcast cut
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public Cut Key manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastCutKey"
        "404":
          description: Cut Key not found
  /podcast/cut-keys/{key}/audio:
    get:
      operationId: streamPodcastCutKeyAudio
      tags: [autography]
      summary: Stream audio only when resolved by a current public Cut Key
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: WAV audio stream
          content:
            audio/wav:
              schema:
                type: string
                format: binary
  /context:
    get:
      operationId: getContext
      tags: [autography]
      summary: Get the context repository
      responses:
        "200":
          description: Context items used to draft claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextResponse"
  /calls:
    get:
      operationId: getCalls
      tags: [autography]
      summary: Get all Calls
      responses:
        "200":
          description: Calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"
  /call/active:
    get:
      operationId: getActiveCall
      tags: [autography]
      summary: Get the active Call and computed clock state
      responses:
        "200":
          description: Active Call state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveCall"
  /pr/{id}:
    get:
      operationId: getPullRequest
      tags: [autography]
      summary: Get a staged response set
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Pull request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequest"
        "404":
          description: Not found
  /pr/{id}/sign:
    post:
      operationId: signPullRequest
      tags: [autography]
      summary: Sign one staged move
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignPullRequestInput"
      responses:
        "200":
          description: Evaluation and possible issued Drop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignResult"
  /evaluate:
    post:
      operationId: evaluatePolicy
      tags: [autography]
      summary: Evaluate a proposed action through the deterministic Velvet Rope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyEvaluationInput"
      responses:
        "200":
          description: First policy failure or pass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evaluation"
  /agent/run:
    post:
      operationId: runAgentFlow
      tags: [autography]
      summary: Run the four-stage read, classify, reconcile, and draft flow
      responses:
        "200":
          description: Agent flow status; fixture data remains available for the demo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunResult"
  /pr/{id}/dismiss:
    post:
      operationId: dismissPullRequest
      tags: [autography]
      summary: Close a Pull Request without publishing
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Dismissed Pull Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DismissResult"
  /drop/{id}:
    get:
      operationId: getDrop
      tags: [autography]
      summary: Get an issued Drop
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Issued Drop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drop"
        "404":
          description: Not found
  /verify:
    post:
      operationId: verifyDrop
      tags: [autography]
      summary: Verify a Drop id or hash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyDropInput"
      responses:
        "200":
          description: Registry lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResult"
  /receipts:
    get:
      operationId: getReceipts
      tags: [autography]
      summary: Get the append-only Receipt log
      responses:
        "200":
          description: Receipt entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Receipt"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required: [status, storage]
      properties:
        status:
          type: string
        storage:
          type: string
          enum: [healthy, degraded]
    Show:
      type: object
      required: [title, episode, subtitle, aired_at, transcript_excerpt]
      properties:
        title: { type: string }
        episode: { type: number }
        subtitle: { type: string }
        aired_at: { type: string }
        transcript_excerpt: { type: string }
    CallSubject:
      type: object
      required: [id, display]
      properties:
        id: { type: string }
        display: { type: string }
    CallIssuer:
      type: object
      required: [id, display]
      properties:
        id: { type: string }
        display: { type: string }
    CallEngagement:
      type: object
      required: [show, episode, capacity]
      properties:
        show: { type: string }
        episode: { type: number }
        capacity: { type: string }
    CallWindow:
      type: object
      required: [valid_from, valid_until]
      properties:
        valid_from: { type: string }
        valid_until: { type: string }
    CallReach:
      type: object
      required: [territory, platform]
      properties:
        territory: { type: string }
        platform: { type: string }
    CallSignatures:
      type: object
      required: [issuer_sig]
      properties:
        issuer_sig: { type: string }
        subject_countersig: { type: ["string", "null"] }
    Call:
      type: object
      required: [call_id, subject, issuer, attestation, engagement, window, scopes, exclusions, reach, sig]
      properties:
        call_id: { type: string }
        subject: { $ref: "#/components/schemas/CallSubject" }
        issuer: { $ref: "#/components/schemas/CallIssuer" }
        attestation: { type: string }
        engagement: { $ref: "#/components/schemas/CallEngagement" }
        window: { $ref: "#/components/schemas/CallWindow" }
        scopes:
          type: array
          items: { type: string }
        exclusions:
          type: array
          items: { type: string }
        reach: { $ref: "#/components/schemas/CallReach" }
        sig: { $ref: "#/components/schemas/CallSignatures" }
    ActiveCall:
      type: object
      required: [call, state, seconds_remaining]
      properties:
        call: { $ref: "#/components/schemas/Call" }
        state:
          type: string
          enum: [LIVE, INERT, DARK]
        seconds_remaining: { type: number }
    SignalAuthor:
      type: object
      required: [handle, account_age_days, followers]
      properties:
        handle: { type: string }
        account_age_days: { type: number }
        followers: { type: number }
    SignalEngagement:
      type: object
      required: [likes, reposts]
      properties:
        likes: { type: number }
        reposts: { type: number }
    SignalEvent:
      type: object
      required: [id, text, author, posted_at, platform, engagement, cluster_id]
      properties:
        id: { type: string }
        text: { type: string }
        author: { $ref: "#/components/schemas/SignalAuthor" }
        posted_at: { type: string }
        platform: { type: string }
        engagement: { $ref: "#/components/schemas/SignalEngagement" }
        cluster_id: { type: string }
        provenance: { $ref: "#/components/schemas/ObservationProvenance" }
    ObservationProvenance:
      type: object
      required: [source_id, source_class, consent_ref, observation_window, received_at, freshness, confidence]
      properties:
        source_id: { type: string }
        source_class: { type: string }
        consent_ref: { type: string }
        observation_window:
          type: object
          required: [start, end]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        freshness: { type: string }
        confidence: { type: string }
    LiveObservation:
      type: object
      required: [id, text, observed_at, observation_window, confidence]
      properties:
        id: { type: string }
        text: { type: string, minLength: 1, maxLength: 2000 }
        observed_at: { type: string, format: date-time }
        observation_window:
          type: object
          required: [start, end]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        confidence:
          type: string
          enum: [low, medium, high]
    LiveObservationBatch:
      type: object
      required: [source_id, source_class, consent_ref, policy_review_ref, observations]
      properties:
        source_id:
          type: string
          enum: [consented-newsroom-v1]
        source_class:
          type: string
          enum: [consented_newsroom]
        consent_ref: { type: string, minLength: 1 }
        policy_review_ref: { type: string, minLength: 1 }
        observations:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/LiveObservation" }
    LiveObservationReceipt:
      type: object
      required: [accepted, source_id, received_at, observation_count, flood]
      properties:
        accepted: { type: boolean }
        source_id: { type: string }
        received_at: { type: string, format: date-time }
        observation_count: { type: number }
        flood: { $ref: "#/components/schemas/FloodResponse" }
    TimelinePulse:
      type: object
      required: [id, label, timestamp, intensity, cluster_id, source_class, freshness, confidence]
      properties:
        id: { type: string }
        label: { type: string }
        timestamp: { type: string }
        intensity: { type: number }
        cluster_id: { type: string }
        source_class: { type: string }
        freshness: { type: string }
        confidence: { type: string }
    EvidenceCitation:
      type: object
      required: [id, label, source_class, source_ref, observation_window, freshness, confidence, excerpt]
      properties:
        id: { type: string }
        label: { type: string }
        source_class: { type: string }
        source_ref: { type: string }
        observation_window: { type: string }
        freshness: { type: string }
        confidence: { type: string }
        excerpt: { type: string }
    AudienceQuestion:
      type: object
      required: [id, prompt, grouped_count, cluster_id, answerability, context_refs]
      properties:
        id: { type: string }
        prompt: { type: string }
        grouped_count: { type: number }
        cluster_id: { type: string }
        answerability: { type: string }
        context_refs:
          type: array
          items: { type: string }
    SafetyHold:
      type: object
      required: [id, label, severity, reason, status, safe_action]
      properties:
        id: { type: string }
        label: { type: string }
        severity: { type: string }
        reason: { type: string }
        status: { type: string }
        safe_action: { type: string }
    RolePermission:
      type: object
      required: [role, label, can_view, can_stage, can_sign, emphasis]
      properties:
        role: { type: string }
        label: { type: string }
        can_view: { type: boolean }
        can_stage: { type: boolean }
        can_sign: { type: boolean }
        emphasis:
          type: array
          items: { type: string }
    CoordinationSignals:
      type: object
      required: [duplicate_phrasing, account_age_clustering, burst_window_seconds, cadence_irregularity]
      properties:
